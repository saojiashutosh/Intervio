# Production stack: the backend only. nginx runs on the host and proxies to 127.0.0.1:8000.
# Backend settings live in backend/.env (copy backend/.env.example).
# The database is external (Neon), set via DATABASE_URL in that file.
services:
  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      DJANGO_DEBUG: "0"
    ports:
      # Localhost only: reachable by the host's nginx, not from the internet.
      - "127.0.0.1:8000:8000"
